name: Inventory Service CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          set +e
          pytest tests/ --junitxml=test-results.xml -v 2>&1 | tee test-output.log
          echo ${PIPESTATUS[0]} > .pytest_exit
          exit 0

      - name: Flakeless ML analysis
        if: always()
        run: python3 .github/flakeless_analyze.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakeless-report-${{ github.run_number }}
          path: |
            test-results.xml
            test-output.log
            flakeless-report.json
          retention-days: 30

      - name: Fail if tests failed
        if: always()
        run: |
          EXIT=$(cat .pytest_exit 2>/dev/null || echo 0)
          if [ "$EXIT" != "0" ]; then
            echo "TESTS FAILED — build is RED."
            exit 1
          fi
          echo "All tests passed."
