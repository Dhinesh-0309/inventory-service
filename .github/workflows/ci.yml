name: Inventory Service CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# ── Environment ────────────────────────────────────────────────────────────────
# FLAKELESS_API_URL is set as a GitHub Actions secret/variable.
# When running locally or without the secret, the workflow falls back to
# saving the raw JUnit XML as the only artifact.
# Set it to your ngrok/local tunnel URL while recording the demo.

env:
  FLAKELESS_API_URL: ${{ vars.FLAKELESS_API_URL || '' }}

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run tests → JUnit XML ─────────────────────────────────────────────
      - name: Run test suite
        id: run_tests
        continue-on-error: true
        run: |
          pytest tests/ --junitxml=test-results.xml -v 2>&1 | tee test-output.log
          echo "TEST_OUTCOME=$?" >> $GITHUB_ENV

      # ── 5. Flakeless ML Analysis ─────────────────────────────────────────────
      # Sends the real JUnit XML to the Flakeless inference API.
      # The API loads the trained GradientBoosting model and runs
      # predict_proba() on TF-IDF + structured features.
      # Falls back gracefully when the API URL is not configured.
      - name: Flakeless ML — analyze with trained model
        if: always()
        run: |
          if [ ! -f test-results.xml ]; then
            echo "No test results file — skipping Flakeless analysis"
            exit 0
          fi

          if [ -z "$FLAKELESS_API_URL" ]; then
            echo "FLAKELESS_API_URL not set."
            echo "To enable real ML analysis:"
            echo "  1. Start the API: python scripts/start_api.py"
            echo "  2. Expose it: ngrok http 8000"
            echo "  3. Add FLAKELESS_API_URL to GitHub repo variables"
            echo ""
            echo "Saving raw JUnit XML as artifact only."
            exit 0
          fi

          echo "Sending test results to Flakeless ML API at $FLAKELESS_API_URL"

          # Get changed files from this commit for regression signal
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | tr '\n' ',' | sed 's/,$//' || echo "")

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${FLAKELESS_API_URL}/analyze" \
            -F "junit_xml=@test-results.xml" \
            -F "repo_id=inventory-service" \
            -F "run_id=${{ github.run_id }}" \
            -F "commit_sha=${{ github.sha }}" \
            -F "branch=${{ github.ref_name }}" \
            -F "commit_age_h=0.1" \
            -F "changed_files=${CHANGED}" \
            --max-time 30)

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Flakeless API returned HTTP $HTTP_STATUS"
            echo "$BODY"
            echo "Continuing without ML analysis."
            exit 0
          fi

          echo "$BODY" > flakeless-report.json

          echo ""
          echo "============================================================"
          echo "FLAKELESS ML — CI ANALYSIS (Trained Model)"
          echo "============================================================"

          python3 - <<'PYEOF'
          import json, sys

          with open("flakeless-report.json") as f:
              report = json.load(f)

          print(f"Model version : {report['model_version']}")
          print(f"Threshold     : {report['threshold']}")
          print(f"Tests         : {report['total_tests']} total | "
                f"{report['failed_tests']} failed | "
                f"{report['passed_tests']} passed")
          print()

          preds = report.get("predictions", [])
          if not preds:
              print("No failures — all tests passed.")
          else:
              for p in preds:
                  status = "ABSTAINED" if p["abstained"] else p["assessment"]
                  print(f"  [{p['priority']}] {status}")
                  print(f"       {p['test_id']}")
                  if p.get("abstention_reason"):
                      print(f"       Reason: {p['abstention_reason'][:100]}")
                  elif p.get("suggested_action"):
                      print(f"       Next: {p['suggested_action'][:100]}")
                  print()

          summary = report.get("outcome_summary", {})
          print("Outcome summary:")
          label_map = {
              "regression":            "Potential Regression (P1)",
              "flaky":                 "Likely Flaky (P2)",
              "insufficient_evidence": "Insufficient Evidence (P3)",
          }
          for k, v in summary.items():
              print(f"  {label_map.get(k, k)}: {v}")
          print("============================================================")
          PYEOF

      # ── 6. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakeless-ci-${{ github.run_number }}-${{ github.sha }}
          path: |
            test-results.xml
            test-output.log
            flakeless-report.json
          retention-days: 30

      # ── 7. Preserve original test status ─────────────────────────────────────
      # Flakeless NEVER masks a real test failure.
      # If tests failed the build fails — Flakeless is additional context only.
      - name: Enforce original test result
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "failure" ]; then
            echo ""
            echo "BUILD FAILED: Tests reported failures."
            echo "Flakeless ML analysis is available in the artifacts."
            echo "Review the assessment — but do not dismiss failures automatically."
            exit 1
          fi
          echo "All tests passed."
