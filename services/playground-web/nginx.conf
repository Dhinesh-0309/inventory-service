server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/orders {
        proxy_pass http://orders:8080/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/inventory/demo/behavior {
        proxy_pass http://inventory:8000/demo/behavior;
        proxy_set_header Host $host;
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
